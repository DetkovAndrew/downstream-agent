# Компании для сравнения. Ссылки не нужны: агент сам ищет отчёты и новости в сети.
#   pages   — страницы IR/пресс-центра: с них собираются ссылки на PDF и отчёты
#   feeds   — RSS/Atom новостей и пресс-релизов
#   pdfs    — прямые ссылки на конкретные PDF (если страница не отдаётся скрапером)
# Часть сайтов закрыта от ботов или рисуется JS — тогда кладите прямые ссылки в pdfs
# или файлы вручную в data/raw/<id>/reports/.

[collector]
user_agent = "Mozilla/5.0 (X11; Linux x86_64) Downstream-Agent/0.1"
timeout = 30
max_pdf_mb = 80
delay_sec = 1.0
# ссылки на PDF берём, только если в ссылке или тексте есть одно из слов
pdf_keywords = ["annual", "quarter", "results", "report", "financial", "20-f", "10-k", "interim", "earnings", "ifrs", "年报", "年度", "季度", "中期", "отчет", "отчёт", "мсфо", "результат"]

